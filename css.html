<style>
    /* ==========================================================================
     SmartTest V. 1.2 - SMPN 1 MESUJI MAKMUR
     Custom Stylesheet: Claymorphic 3D Pastel + TKA Kemendikbud CBT Style
     ========================================================================== */

    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');

    :root {
        --font-main: 'Plus Jakarta Sans', 'Nunito', -apple-system, sans-serif;
        --font-cbt: 'Plus Jakarta Sans', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
        --primary-green: #52c48e;
        --primary-green-dark: #3da875;
        --bg-cloud: #f4fbf7;
        --cbt-navy: #1e3a8a;
        --cbt-header-bg: #1e293b;
        --exam-font-scale: 1rem;
    }

    body {
        font-family: var(--font-main);
        background-color: #f1f5f9;
        color: #1e293b;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
    }

    /* Izin Khusus Input & Textarea agar Dapat Diketik & Fokus di Layar Sentuh HP */
    input,
    textarea,
    select {
        user-select: text !important;
        -webkit-user-select: text !important;
    }

    /* Cloud Top Curve */
    .cloud-header {
        background: linear-gradient(180deg, #5ec993 0%, #4ebc85 85%, #42b27b 100%);
        position: relative;
        border-bottom-left-radius: 36px;
        border-bottom-right-radius: 36px;
        box-shadow: 0 10px 25px -5px rgba(66, 178, 123, 0.35);
    }

    .cloud-header::after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        height: 18px;
        background: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1200 120%22 preserveAspectRatio=%22none%22%3E%3Cpath d=%22M0,0 C150,90 350,-40 500,40 C650,120 900,10 1200,50 L1200,120 L0,120 Z%22 fill=%22%23f8fafc%22%3E%3C/path%3E%3C/svg%3E");
        background-size: cover;
    }

    /* Sun Glow Animation */
    .sun-bounce {
        animation: sunFloat 3s ease-in-out infinite;
    }

    @keyframes sunFloat {

        0%,
        100% {
            transform: translateY(0px) rotate(0deg);
        }

        50% {
            transform: translateY(-4px) rotate(3deg);
        }
    }

    /* 3D Claymorphic Buttons */
    .clay-card {
        background: #ffffff;
        border-radius: 26px;
        box-shadow:
            0 12px 24px -8px rgba(100, 116, 139, 0.16),
            0 4px 6px -2px rgba(100, 116, 139, 0.05),
            inset 0 2px 4px rgba(255, 255, 255, 0.9),
            inset 0 -3px 4px rgba(0, 0, 0, 0.03);
        transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .clay-btn {
        border-radius: 22px;
        position: relative;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.25rem 0.75rem;
        outline: none;
        border: none;
    }

    .clay-btn:hover {
        transform: translateY(-4px) scale(1.02);
    }

    .clay-btn:active {
        transform: translateY(2px) scale(0.97);
    }

    /* Theme Button Colors (Matching Reference Image) */
    .clay-mint {
        background: linear-gradient(145deg, #d4f7e5 0%, #b8edd3 100%);
        box-shadow:
            0 10px 18px -4px rgba(78, 188, 133, 0.35),
            inset 0 3px 6px rgba(255, 255, 255, 0.8),
            inset 0 -4px 6px rgba(56, 153, 105, 0.25);
        border: 1px solid rgba(110, 231, 183, 0.5);
        color: #166534;
    }

    .clay-blue {
        background: linear-gradient(145deg, #dcf0fa 0%, #bce3f8 100%);
        box-shadow:
            0 10px 18px -4px rgba(56, 149, 219, 0.35),
            inset 0 3px 6px rgba(255, 255, 255, 0.8),
            inset 0 -4px 6px rgba(43, 114, 186, 0.25);
        border: 1px solid rgba(147, 197, 253, 0.5);
        color: #1e40af;
    }

    .clay-coral {
        background: linear-gradient(145deg, #ffe6d8 0%, #fed0b7 100%);
        box-shadow:
            0 10px 18px -4px rgba(249, 115, 22, 0.32),
            inset 0 3px 6px rgba(255, 255, 255, 0.8),
            inset 0 -4px 6px rgba(217, 91, 12, 0.25);
        border: 1px solid rgba(254, 215, 170, 0.6);
        color: #9a3412;
    }

    .clay-purple {
        background: linear-gradient(145deg, #f0e6ff 0%, #e1d0fc 100%);
        box-shadow:
            0 10px 18px -4px rgba(147, 51, 234, 0.3),
            inset 0 3px 6px rgba(255, 255, 255, 0.8),
            inset 0 -4px 6px rgba(126, 34, 206, 0.22);
        border: 1px solid rgba(216, 180, 254, 0.6);
        color: #6b21a8;
    }

    .clay-yellow {
        background: linear-gradient(145deg, #fef9db 0%, #fef0b3 100%);
        box-shadow:
            0 10px 18px -4px rgba(234, 179, 8, 0.3),
            inset 0 3px 6px rgba(255, 255, 255, 0.8),
            inset 0 -4px 6px rgba(180, 130, 8, 0.25);
        border: 1px solid rgba(254, 240, 138, 0.6);
        color: #854d0e;
    }

    .clay-pink {
        background: linear-gradient(145deg, #ffe4ee 0%, #fcc8dc 100%);
        box-shadow:
            0 10px 18px -4px rgba(236, 72, 153, 0.3),
            inset 0 3px 6px rgba(255, 255, 255, 0.8),
            inset 0 -4px 6px rgba(190, 24, 93, 0.22);
        border: 1px solid rgba(251, 207, 232, 0.6);
        color: #9d174d;
    }

    /* 3D Icon Container inside buttons */
    .icon-3d-bubble {
        width: 62px;
        height: 62px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        margin-bottom: 0.6rem;
        position: relative;
        transition: transform 0.2s;
    }

    .clay-btn:hover .icon-3d-bubble {
        transform: scale(1.1);
    }

    /* ==========================================================================
     TKA / CBT KEMENDIKBUD STYLE EXAM INTERFACE
     ========================================================================== */

    .cbt-header {
        background: #1e293b;
        color: #ffffff;
        border-bottom: 3px solid #3b82f6;
    }

    .cbt-badge-timer {
        background: #0f172a;
        border: 2px solid #3b82f6;
        color: #38bdf8;
        font-family: var(--font-mono);
    }

    .cbt-badge-timer.danger {
        border-color: #ef4444;
        color: #f87171;
        animation: pulseDanger 1s infinite;
    }

    @keyframes pulseDanger {

        0%,
        100% {
            opacity: 1;
            transform: scale(1);
        }

        50% {
            opacity: 0.8;
            transform: scale(1.04);
        }
    }

    .font-size-btn {
        background: #334155;
        color: #f8fafc;
        border: 1px solid #475569;
        padding: 2px 10px;
        font-weight: 700;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s;
    }

    .font-size-btn:hover {
        background: #475569;
    }

    .font-size-btn.active {
        background: #3b82f6;
        border-color: #60a5fa;
    }

    /* Floating Violation Badge */
    .floating-violation-badge {
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    /* Touch-Optimized Mobile CBT Frame */
    #examFrameContainer {
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
        overscroll-behavior-y: contain;
    }

    #cbtExamIframe {
        width: 100%;
        height: 100%;
        border: none;
        -webkit-overflow-scrolling: touch;
    }

    /* Live Broadcast Ticker Banner */
    .broadcast-ticker {
        background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%);
        box-shadow: 0 2px 8px rgba(217, 119, 6, 0.3);
    }

    .broadcast-ticker-badge {
        animation: broadcastBadgePulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes broadcastBadgePulse {
        0% {
            transform: scale(0.97);
            opacity: 0.9;
        }

        100% {
            transform: scale(1.03);
            opacity: 1;
        }
    }

    /* Red Screen Lock Modal */
    .locked-screen-overlay {
        background: radial-gradient(circle, #991b1b 0%, #450a0a 100%);
        animation: lockPulse 2s ease-in-out infinite alternate;
    }

    @keyframes lockPulse {
        0% {
            box-shadow: inset 0 0 50px rgba(239, 68, 68, 0.4);
        }

        100% {
            box-shadow: inset 0 0 100px rgba(220, 38, 38, 0.8);
        }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }

    ::-webkit-scrollbar-track {
        background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
    }

    /* Modal Transition */
    .modal-backdrop {
        background-color: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(4px);
        transition: opacity 0.2s ease-in-out;
    }

    .hidden,
    .modal-backdrop.hidden,
    .app-view.hidden,
    #appLoadingOverlay.hidden {
        display: none !important;
    }

    /* Anti-cheat overlay message */
    .badge-pulse {
        animation: badgePing 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes badgePing {

        75%,
        100% {
            transform: scale(1.15);
            opacity: 0;
        }
    }

    /* ==========================================================================
     KARTU PESERTA UJIAN (ASAS SMPN 1 MESUJI MAKMUR) - 100% DESIGN REPLICA
     ========================================================================== */
    .kartu-peserta-item {
        background: #ffffff;
        border-radius: 14px;
        border: 1.5px solid #cbd5e1;
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
        position: relative;
        overflow: hidden;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .kartu-peserta-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
    }

    /* PRINT MODE KHUSUS KARTU PESERTA UJIAN (A4 PORTRAIT - MUAT TEPAT 6 KARTU 9x8 CM) */
    @media print {
        body {
            background: #ffffff !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        @page {
            size: A4 portrait !important;
            margin: 6mm 10mm 6mm 10mm !important;
        }

        header,
        nav,
        .guru-tab-btn,
        button,
        select,
        label,
        .modal-backdrop,
        #appToast,
        #appLoadingOverlay,
        #guruBroadcastBar,
        #kartuToolbarHeader {
            display: none !important;
        }

        #viewGuruDashboard {
            box-shadow: none !important;
            max-width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
        }

        #guruTab_kartu {
            display: block !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        .guru-tab-content:not(#guruTab_kartu) {
            display: none !important;
        }

        #kartuUjianGrid {
            display: grid !important;
            grid-template-columns: repeat(2, 90mm) !important;
            justify-content: center !important;
            column-gap: 6mm !important;
            row-gap: 5mm !important;
            padding: 0 !important;
            margin: 0 auto !important;
            width: auto !important;
        }

        .kartu-peserta-item {
            width: 90mm !important;
            height: 80mm !important;
            max-height: 80mm !important;
            min-height: 80mm !important;
            box-sizing: border-box !important;
            page-break-inside: avoid !important;
            break-inside: avoid !important;
            box-shadow: none !important;
            border: 1.2px solid #0b2f64 !important;
            border-radius: 8px !important;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            overflow: hidden !important;
        }
    }
</style>
